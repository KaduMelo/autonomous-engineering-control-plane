name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          uv venv --python 3.12
          uv pip install -e ".[dev]"

      - name: Lint
        run: |
          .venv/bin/ruff check src tests
          .venv/bin/ruff format --check src tests

      - name: Type check
        run: .venv/bin/mypy

      # The integration suite runs LLM-shaped code in this image. Building it
      # here is what lets the isolation tests assert against a real container
      # rather than only against the flags we pass.
      - name: Build the validation sandbox
        run: docker build -t fixloop-sandbox:latest sandbox/

      - name: Test
        run: .venv/bin/python -m pytest -q
        env:
          # No credential is set on purpose. Every test drives the loop through
          # a scripted FixerPort; a suite that needs an API key to pass would be
          # a suite nobody runs.
          ANTHROPIC_API_KEY: ""

      # The recorded history is a fixture, not build output. If it no longer
      # matches the workflow, the replay test above already failed - this only
      # catches a history that was regenerated but not committed.
      - name: Check the recorded history is committed
        run: git diff --exit-code tests/replay/histories/
